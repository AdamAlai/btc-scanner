<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATOM BOT</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --g:#00ff88;--g2:#00ff8844;--g3:#00ff8822;
  --r:#ff3355;--r2:#ff335533;
  --y:#ffcc00;--w:#ffffff;
  --bg:#000;--bg2:#080808;--bg3:#0d0d0d;
  --b1:#111;--b2:#1a1a1a;
  --dim:#555;--mid:#888;
}
body{background:var(--bg);color:var(--w);font-family:'Share Tech Mono',monospace;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,136,.008) 2px,rgba(0,255,136,.008) 4px);pointer-events:none;z-index:9999}

/* HEADER */
.hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--b1);position:sticky;top:0;background:rgba(0,0,0,.97);backdrop-filter:blur(12px);z-index:100;gap:12px;flex-wrap:wrap}
.logo{font-family:'Orbitron',monospace;font-weight:900;font-size:1.3rem;letter-spacing:8px;color:var(--w)}
.logo em{color:var(--g);font-style:normal;text-shadow:0 0 20px var(--g)}
.live{display:flex;align-items:center;gap:8px;font-size:.6rem;letter-spacing:3px;color:var(--g);background:var(--g3);border:1px solid var(--g2);padding:5px 12px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--g);box-shadow:0 0 10px var(--g),0 0 20px var(--g);animation:dp 1.2s ease-in-out infinite;flex-shrink:0}
@keyframes dp{0%,100%{opacity:1;box-shadow:0 0 10px var(--g),0 0 24px var(--g)}50%{opacity:.2;box-shadow:0 0 3px var(--g)}}

/* BOT SWITCHER */
.bots{display:flex;padding:0 20px;border-bottom:1px solid var(--b1);gap:0;overflow-x:auto}
.bbot{background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);font-family:'Orbitron',monospace;font-size:.58rem;padding:10px 18px;cursor:pointer;letter-spacing:3px;white-space:nowrap;margin-bottom:-1px;transition:all .15s}
.bbot.on{color:var(--g);border-bottom-color:var(--g);text-shadow:0 0 10px var(--g)}
.bbot.soon{color:#222;cursor:not-allowed}

/* PRICE */
.price-wrap{text-align:center;padding:24px 20px 16px;border-bottom:1px solid var(--b1)}
.price-lbl{font-size:.58rem;letter-spacing:4px;color:var(--dim);margin-bottom:6px}
.price-num{font-family:'Orbitron',monospace;font-weight:700;font-size:clamp(2rem,8vw,3.2rem);color:var(--w);letter-spacing:3px}
.price-row{display:flex;justify-content:center;gap:20px;margin-top:8px;flex-wrap:wrap}
.pch{font-size:.78rem;letter-spacing:2px}.pch.up{color:var(--g)}.pch.dn{color:var(--r)}
.pupd{font-size:.6rem;color:var(--dim)}

/* TRADE CARD */
.tc{margin:14px 20px;border:1px solid var(--b2);background:var(--bg2);padding:18px 20px}
.tc.long{border-color:#00ff8855;background:rgba(0,255,136,.03)}
.tc.short{border-color:#ff335544;background:rgba(255,51,85,.03)}
.tc.none{border-color:var(--b1)}
.tc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.tc-dir{font-family:'Orbitron',monospace;font-size:1rem;font-weight:700;letter-spacing:5px}
.tc-dir.long{color:var(--g);text-shadow:0 0 14px var(--g)}
.tc-dir.short{color:var(--r);text-shadow:0 0 14px var(--r)}
.tc-dir.none{color:var(--dim)}
.tc-tf{font-size:.6rem;color:var(--dim);margin-top:3px;letter-spacing:2px}
.tc-pnl-wrap{text-align:right}
.tc-pnl-lbl{font-size:.55rem;letter-spacing:2px;color:var(--dim);margin-bottom:3px}
.tc-pnl{font-family:'Orbitron',monospace;font-size:1.3rem;font-weight:700}
.tc-pnl.pos{color:var(--g);text-shadow:0 0 12px var(--g)}
.tc-pnl.neg{color:var(--r);text-shadow:0 0 12px var(--r)}
.tc-pnl.na{color:var(--dim)}
.tc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:480px){.tc-grid{grid-template-columns:repeat(2,1fr)}}
.tc-cell{background:var(--bg3);padding:10px 12px}
.tc-cell-lbl{font-size:.52rem;letter-spacing:2px;color:var(--dim);margin-bottom:4px}
.tc-cell-val{font-size:.85rem;color:var(--w)}
.tc-cell-val.g{color:var(--g)}.tc-cell-val.r{color:var(--r)}.tc-cell-val.y{color:var(--y)}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--b1);margin:0 20px 14px;border:1px solid var(--b1)}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.sc{background:var(--bg2);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.sc-lbl{font-size:.52rem;letter-spacing:2px;color:var(--dim)}
.sc-val{font-family:'Orbitron',monospace;font-size:.95rem;font-weight:700;color:var(--w)}
.sc-val.g{color:var(--g)}.sc-val.r{color:var(--r)}.sc-val.y{color:var(--y)}
.wbar{height:3px;background:var(--b1);margin-top:5px;border-radius:2px}
.wfill{height:100%;background:linear-gradient(90deg,#00ff8866,var(--g));border-radius:2px;transition:width .8s}

/* TABS */
.tabs{display:flex;padding:0 20px;border-bottom:1px solid var(--b1);overflow-x:auto}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);font-family:'Share Tech Mono',monospace;font-size:.68rem;padding:11px 18px;cursor:pointer;letter-spacing:2px;white-space:nowrap;margin-bottom:-1px;transition:all .15s}
.tab:hover{color:var(--mid)}
.tab.on{color:var(--g);border-bottom-color:var(--g)}
.tbadge{background:var(--g3);color:var(--g);border-radius:2px;font-size:.52rem;padding:1px 5px;margin-left:5px}

/* CONTENT */
.tcon{display:none;padding:14px 20px}.tcon.on{display:block}
.feed{display:flex;flex-direction:column;gap:1px}
.fi{display:flex;gap:14px;padding:11px 14px;background:var(--bg2);border-left:3px solid transparent;align-items:flex-start}
.fi:hover{background:var(--bg3)}
.fi.won{border-left-color:var(--g)}.fi.lost{border-left-color:var(--r)}
.fi.long{border-left-color:var(--g)}.fi.short{border-left-color:var(--r)}
.fi.surge{border-left-color:var(--y)}.fi.info{border-left-color:var(--b2)}
.ft{font-size:.6rem;color:var(--dim);white-space:nowrap;padding-top:2px;min-width:72px}
.fb{flex:1}
.fttl{font-size:.76rem;margin-bottom:3px;letter-spacing:1px}
.fttl.g{color:var(--g)}.fttl.r{color:var(--r)}.fttl.y{color:var(--y)}.fttl.w{color:var(--w)}
.fdtl{font-size:.63rem;color:var(--mid);line-height:1.6}
.fpnl{font-family:'Orbitron',monospace;font-size:.82rem;font-weight:700;white-space:nowrap;padding-top:2px}
.fpnl.pos{color:var(--g)}.fpnl.neg{color:var(--r)}
.empty{text-align:center;padding:44px 20px;color:var(--dim);font-size:.72rem;letter-spacing:2px}
.empty .ico{font-size:1.8rem;margin-bottom:10px;opacity:.25}

/* FOOTER */
.ftr{text-align:center;padding:20px;font-size:.52rem;color:#1e1e1e;letter-spacing:3px;border-top:1px solid var(--b1);margin-top:20px}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:#000}
::-webkit-scrollbar-thumb{background:#1a1a1a}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">ATOM <em>BOT</em></div>
  <div class="live"><div class="dot"></div>LIVE</div>
</div>

<div class="bots">
  <button class="bbot on">ATOM</button>
  <button class="bbot soon">OROCHI</button>
  <button class="bbot soon">TJR</button>
</div>

<div class="price-wrap">
  <div class="price-lbl">BTC / USD</div>
  <div class="price-num" id="pnum">—</div>
  <div class="price-row">
    <div class="pch" id="pch">—</div>
    <div class="pupd" id="pupd">fetching...</div>
  </div>
</div>

<div class="tc none" id="tc">
  <div class="tc-top">
    <div>
      <div class="tc-dir none" id="tdir">NO OPEN TRADE</div>
      <div class="tc-tf" id="ttf">waiting for next setup...</div>
    </div>
    <div class="tc-pnl-wrap">
      <div class="tc-pnl-lbl">LIVE PNL</div>
      <div class="tc-pnl na" id="tpnl">—</div>
    </div>
  </div>
  <div class="tc-grid" id="tgrid"></div>
</div>

<div class="stats">
  <div class="sc">
    <div class="sc-lbl">TOTAL PNL</div>
    <div class="sc-val" id="spnl">—</div>
    <div class="wbar"><div class="wfill" id="wfill" style="width:0%"></div></div>
  </div>
  <div class="sc"><div class="sc-lbl">WIN RATE</div><div class="sc-val y" id="swr">—</div></div>
  <div class="sc"><div class="sc-lbl">W / L</div><div class="sc-val" id="swl">—</div></div>
  <div class="sc"><div class="sc-lbl">BEST TRADE</div><div class="sc-val g" id="sbest">—</div></div>
</div>

<div class="tabs">
  <button class="tab on" onclick="stab('trades',this)">TRADES<span class="tbadge" id="bt">0</span></button>
  <button class="tab" onclick="stab('signals',this)">SIGNALS<span class="tbadge" id="bs">0</span></button>
  <button class="tab" onclick="stab('notifs',this)">NOTIFICATIONS<span class="tbadge" id="bn">0</span></button>
</div>

<div class="tcon on" id="tab-trades">
  <div class="feed" id="ftrades"><div class="empty"><div class="ico">◈</div>no completed trades yet</div></div>
</div>
<div class="tcon" id="tab-signals">
  <div class="feed" id="fsignals"><div class="empty"><div class="ico">◈</div>signals will appear here</div></div>
</div>
<div class="tcon" id="tab-notifs">
  <div class="feed" id="fnotifs"><div class="empty"><div class="ico">◈</div>loading...</div></div>
</div>

<div class="ftr">ATOM BOT ◈ WAVE STRATEGY ◈ AUTO-REFRESH 30s</div>

<script>
const U="AdamAlai",R="btc-scanner",B="main";
let cp=0,ot=null;

function raw(f){return`https://raw.githubusercontent.com/${U}/${R}/${B}/${f}?t=${Date.now()}`}
function fm(n){const a=Math.abs(Math.round(n));return(n>=0?"+$":"-$")+a.toLocaleString()}
function fp(n){return"$"+Math.round(n).toLocaleString()}
function ago(s){
  if(!s)return"—";
  const d=new Date(s.replace(" UTC","Z").replace(" ","T"));
  if(isNaN(d))return s;
  const diff=Math.floor((Date.now()-d)/1000);
  if(diff<60)return diff+"s ago";
  if(diff<3600)return Math.floor(diff/60)+"m ago";
  if(diff<86400)return Math.floor(diff/3600)+"h ago";
  return Math.floor(diff/86400)+"d ago";
}

async function fetchPrice(){
  try{
    const r=await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true&t="+Date.now());
    const d=await r.json();
    cp=d.bitcoin.usd;
    const ch=d.bitcoin.usd_24h_change;
    document.getElementById("pnum").textContent="$"+cp.toLocaleString();
    const ce=document.getElementById("pch");
    ce.textContent=(ch>=0?"▲ +":"▼ ")+ch.toFixed(2)+"% (24h)";
    ce.className="pch "+(ch>=0?"up":"dn");
    document.getElementById("pupd").textContent="updated "+new Date().toLocaleTimeString();
    updatePnl();
  }catch(e){document.getElementById("pnum").textContent="unavailable"}
}

function updatePnl(){
  if(!ot||!cp)return;
  const qty=50000/ot.entry;
  const pnl=(ot.direction==="long"?cp-ot.entry:ot.entry-cp)*qty;
  const el=document.getElementById("tpnl");
  el.textContent=fm(pnl);
  el.className="tc-pnl "+(pnl>=0?"pos":"neg");
}

async function fetchState(){
  try{
    const r=await fetch(raw("scanner_state.json"));
    const s=await r.json();
    const t=s.open_trade;
    const card=document.getElementById("tc");
    const dEl=document.getElementById("tdir");
    const tfEl=document.getElementById("ttf");
    const grid=document.getElementById("tgrid");
    const pEl=document.getElementById("tpnl");

    if(!t){
      ot=null;
      card.className="tc none";
      dEl.textContent="NO OPEN TRADE";dEl.className="tc-dir none";
      tfEl.textContent="waiting for next setup...";
      grid.innerHTML="";pEl.textContent="—";pEl.className="tc-pnl na";
      return;
    }
    ot=t;
    card.className="tc "+t.direction;
    dEl.textContent=t.direction.toUpperCase();
    dEl.className="tc-dir "+t.direction;
    tfEl.textContent="["+( t.timeframe||"?")+"] • "+ago(t.time);
    grid.innerHTML=`
      <div class="tc-cell"><div class="tc-cell-lbl">ENTRY</div><div class="tc-cell-val">${fp(t.entry)}</div></div>
      <div class="tc-cell"><div class="tc-cell-lbl">TARGET</div><div class="tc-cell-val g">${fp(t.tp)}</div></div>
      <div class="tc-cell"><div class="tc-cell-lbl">STOP</div><div class="tc-cell-val r">${fp(t.sl)}</div></div>
      <div class="tc-cell"><div class="tc-cell-lbl">QTY</div><div class="tc-cell-val y">${(50000/t.entry).toFixed(4)} BTC</div></div>
      <div class="tc-cell"><div class="tc-cell-lbl">RISK</div><div class="tc-cell-val r">${fp(Math.abs(t.sl-t.entry)*(50000/t.entry))}</div></div>
      <div class="tc-cell"><div class="tc-cell-lbl">SIGNAL</div><div class="tc-cell-val" style="font-size:.62rem;color:var(--mid)">${t.signal||"—"}</div></div>
    `;
    updatePnl();

    // Also push to notifications feed
    renderNotifFromState(s);
  }catch(e){document.getElementById("ttf").textContent="state unavailable"}
}

function renderNotifFromState(s){
  const entries=Object.entries(s.last_signal||{});
  const el=document.getElementById("fnotifs");
  document.getElementById("bn").textContent=entries.length;
  if(!entries.length){
    el.innerHTML='<div class="empty"><div class="ico">◈</div>no signals in state yet</div>';return;
  }
  // Sort newest first
  entries.sort((a,b)=>new Date(b[1])-new Date(a[1]));
  el.innerHTML=entries.map(([key,time])=>{
    const[dir,tf]=key.split("_");
    const isL=dir==="long";
    return`<div class="fi ${dir}">
      <div class="ft">${ago(time)}</div>
      <div class="fb">
        <div class="fttl ${isL?"g":"r"}">${dir.toUpperCase()} SIGNAL FIRED [${tf||"?"}]</div>
        <div class="fdtl">${new Date(time).toUTCString()}</div>
      </div>
    </div>`;
  }).join("");
}

async function fetchLog(){
  try{
    const r=await fetch(raw("trade_log.json"));
    if(!r.ok){renderTrades([]);return;}
    const log=await r.json();
    renderStats(log);
    renderTrades(log);
    renderSignals(log);
  }catch(e){renderTrades([])}
}

function renderStats(log){
  if(!log.length)return;
  const wins=log.filter(t=>t.result==="won");
  const losses=log.filter(t=>t.result==="lost");
  const total=log.reduce((s,t)=>s+t.pnl,0);
  const wr=(wins.length/log.length*100).toFixed(1);
  const best=Math.max(...log.map(t=>t.pnl));
  const pe=document.getElementById("spnl");
  pe.textContent=fm(total);pe.className="sc-val "+(total>=0?"g":"r");
  document.getElementById("swr").textContent=wr+"%";
  document.getElementById("swl").textContent=wins.length+"W / "+losses.length+"L";
  document.getElementById("sbest").textContent=fm(best);
  document.getElementById("wfill").style.width=wr+"%";
  document.getElementById("bt").textContent=log.length;
}

function renderTrades(log){
  const el=document.getElementById("ftrades");
  if(!log.length){el.innerHTML='<div class="empty"><div class="ico">◈</div>no completed trades yet — first win or loss will appear here</div>';return;}
  el.innerHTML=[...log].reverse().map(t=>`
    <div class="fi ${t.result}">
      <div class="ft">${ago(t.close_time)}</div>
      <div class="fb">
        <div class="fttl ${t.result==="won"?"g":"r"}">${t.direction.toUpperCase()} [${t.timeframe}] — ${t.result.toUpperCase()}</div>
        <div class="fdtl">Entry ${fp(t.entry)} → Exit ${fp(t.exit)} &nbsp;|&nbsp; ${t.signal}</div>
      </div>
      <div class="fpnl ${t.pnl>=0?"pos":"neg"}">${fm(t.pnl)}</div>
    </div>`).join("");
}

function renderSignals(log){
  const el=document.getElementById("fsignals");
  document.getElementById("bs").textContent=log.length;
  if(!log.length){el.innerHTML='<div class="empty"><div class="ico">◈</div>signals will appear here</div>';return;}
  el.innerHTML=[...log].reverse().map(t=>{
    const isL=t.direction==="long";
    const isSurge=t.signal&&t.signal.includes("SURGE");
    const cls=isSurge?"surge":isL?"long":"short";
    const tc=isSurge?"y":isL?"g":"r";
    return`<div class="fi ${cls}">
      <div class="ft">${ago(t.open_time)}</div>
      <div class="fb">
        <div class="fttl ${tc}">${t.signal} [${t.timeframe}]</div>
        <div class="fdtl">Entry ${fp(t.entry)} &nbsp;|&nbsp; TP ${fp(t.tp)} &nbsp;|&nbsp; SL ${fp(t.sl)}</div>
      </div>
      <div class="fpnl ${t.pnl>=0?"pos":"neg"}">${fm(t.pnl)}</div>
    </div>`;
  }).join("");
}

function stab(name,btn){
  document.querySelectorAll(".tcon").forEach(t=>t.classList.remove("on"));
  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("on"));
  document.getElementById("tab-"+name).classList.add("on");
  btn.classList.add("on");
}

async function refresh(){
  await Promise.all([fetchPrice(),fetchState(),fetchLog()]);
}

refresh();
setInterval(fetchPrice,10000);
setInterval(refresh,30000);
</script>
</body>
</html>
