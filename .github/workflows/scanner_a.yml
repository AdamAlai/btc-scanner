name: BTC Scanner A

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Run scanner
        run: python scanner.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save state
        run: |
          git config user.name "btc-scanner-bot"
          git config user.email "bot@btcscanner.local"
          git add scanner_state.json trade_log.json || true
          git diff --cached --quiet || git commit -m "state: update after scan"
          git push || true
